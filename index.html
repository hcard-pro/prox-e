<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prox-e">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Prox-e, la borne de commande des artisans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1B1F24; --muted:#667085; --line:#E4E7EC; --soft:#F2F4F7;
  --brand:#587A52; --brand-soft:#E8EFE6; --on-brand:#FFFFFF; --accent:#E36414; --danger:#C23B1B; --ok:#16794A;
  --font:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1317; --surface:#171C21; --ink:#E7EAEE; --muted:#98A2B3; --line:#29313A; --soft:#1F262D;
    --brand:#9CC394; --brand-soft:#1E2E1C; --on-brand:#0E160D; --accent:#F28A45; --danger:#F97066; --ok:#4ADE80;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#171C21; --ink:#E7EAEE; --muted:#98A2B3; --line:#29313A; --soft:#1F262D;
  --brand:#9CC394; --brand-soft:#1E2E1C; --on-brand:#0E160D; --accent:#F28A45; --danger:#F97066; --ok:#4ADE80;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{height:100%}
a{color:inherit}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;line-height:1.2;margin:0 0 .4em}
p{margin:0 0 .5em}
.muted{color:var(--muted)} .small{font-size:.85rem} .r{text-align:right}
.num{font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;flex:none}

/* boutons et champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:40px;padding:0 1rem;border-radius:10px;border:1px solid transparent;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.92rem;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.45}
.btn-sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-sec:hover{background:var(--soft)}
.btn-lg{height:48px;padding:0 1.3rem;font-size:1rem}
.btn-link{background:none;border:0;padding:.3rem .2rem;color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.btn-danger{background:none;border:0;color:var(--danger);font-weight:700;padding:.3rem .2rem;white-space:nowrap}
[data-armed]{color:var(--danger) !important;font-weight:800}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn:hover{background:var(--soft)}
.field{display:grid;gap:.35rem;font-weight:600;font-size:.85rem}
.field .hint{font-weight:500;color:var(--muted);font-size:.8rem}
input:not([type=checkbox]):not([type=color]):not([type=file]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 .8rem;font-weight:500;font-size:.95rem;width:100%;min-width:0}
textarea{height:auto;min-height:84px;padding:.6rem .8rem;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.grid2,.grid3{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stack{display:grid;gap:1rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 220px}
.upload{position:relative;display:inline-flex;align-items:center;gap:.5rem;height:40px;padding:0 1rem;border-radius:10px;border:1px dashed color-mix(in srgb,var(--muted) 60%,transparent);background:var(--soft);font-weight:700;font-size:.9rem;cursor:pointer;overflow:hidden;width:max-content;max-width:100%}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.tog{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.tog input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.tog span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.tog span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tog input:checked+span{background:var(--ok)}
.tog input:checked+span::after{transform:translateX(18px)}
.tog input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}

/* cartes, tableaux, statuts */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:.75rem 1rem;flex-wrap:wrap;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.card-h h2{font-size:1rem;margin:0}
.card-h p{margin:.1rem 0 0}
.card-b{padding:1.25rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem}
.stat{padding:1rem 1.2rem}
.stat .lbl{color:var(--muted);font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.stat .val{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin-top:.15rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:700;background:var(--soft);text-align:left;padding:.6rem 1rem;white-space:nowrap}
.tbl td{padding:.75rem 1rem;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--soft) 50%,transparent)}
.tbl select{height:34px !important;width:auto !important;font-size:.85rem !important}
.tbl input{height:36px !important}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--muted)}
.pill{--st:#667085;display:inline-flex;align-items:center;gap:.35rem;height:24px;padding:0 .6rem;border-radius:999px;font-size:.75rem;font-weight:700;background:color-mix(in srgb,var(--st) 13%,var(--surface));color:color-mix(in srgb,var(--st) 85%,var(--ink));white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--st)}
.badge{display:inline-flex;align-items:center;gap:.2rem;height:20px;padding:0 .45rem;border-radius:6px;font-size:.7rem;font-weight:800;background:var(--brand-soft);color:var(--brand);margin-left:.4rem;vertical-align:middle}
.code{font-weight:800;letter-spacing:.05em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* coque des espaces de gestion */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1rem;background:var(--surface);border-right:1px solid var(--line);padding:1.1rem .8rem;z-index:10}
.brandrow{display:flex;align-items:center;gap:.65rem;padding:0 .4rem}
.logo{position:relative;width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:none}
.logo .i{width:20px;height:20px}
.brandtxt b{display:block;font-size:1.05rem;letter-spacing:-.02em;line-height:1.2}
.brandtxt span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.nav{display:grid;gap:2px}
.nav button{display:flex;gap:.7rem;align-items:center;height:40px;padding:0 .75rem;border-radius:9px;border:0;background:none;color:var(--muted);font-weight:700;text-align:left;width:100%}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--brand-soft);color:var(--brand)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:.9rem;display:grid;gap:.7rem}
.user{display:flex;gap:.6rem;align-items:center;padding:0 .3rem}
.user b{display:block;font-size:.9rem;line-height:1.2}
.user span{display:block}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.main{min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.7rem 2rem 1.1rem;max-width:1320px}
.page-head h1{font-size:1.55rem;margin:0}
.page-head p{margin:.2rem 0 0}
.head-act{display:flex;gap:.6rem;flex-wrap:wrap}
.content{padding:0 2rem 3rem;display:grid;gap:1.25rem;max-width:1320px}
@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .side{height:auto;flex-direction:row;align-items:center;padding:.55rem .75rem;gap:.75rem;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brandtxt span{display:none}
  .nav{display:flex}
  .nav button{white-space:nowrap;height:36px}
  .side-foot{margin:0 0 0 auto;border:0;padding:0;display:flex}
  .user{display:none}
  .page-head{padding:1.2rem 1rem .8rem}
  .content{padding:0 1rem 2rem}
}

/* commandes */
.weeknav{display:flex;gap:.4rem;align-items:center}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1060px}
.day{border-left:1px solid var(--line);min-height:260px;display:flex;flex-direction:column}
.day:first-child{border-left:0}
.dayhead{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:.65rem .8rem;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.85rem}
.dayhead .d{text-transform:capitalize}
.dayhead .n{font-size:.75rem;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:.4rem}
.todo-bub{min-width:24px;height:24px;padding:0 .45rem;border-radius:999px;background:#D92D20;color:#fff;font-size:.78rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(217,45,32,.35);animation:bubPop .35s cubic-bezier(.2,.9,.3,1.4)}
.todo-bub.done{background:#067647;box-shadow:0 2px 6px rgba(6,118,71,.3)}
@keyframes bubPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.paid-pill{display:inline-flex;align-items:center;height:22px;padding:0 .55rem;border-radius:999px;font-size:.72rem;font-weight:800;background:#ECFDF3;color:#067647;border:1px solid #ABEFC6}
.paid-pill.no{background:#FFFAEB;color:#B54708;border-color:#FEDF89}
.pay-toggle{display:flex;gap:.5rem;flex-wrap:wrap}
.pay-toggle button{flex:1;min-width:150px;height:auto;display:flex;align-items:center;justify-content:center;line-height:1.2;color:var(--ink);padding:.7rem 1rem;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:.95rem;cursor:pointer}
.pay-toggle button.on.pay-yes{border-color:#067647;background:#ECFDF3;color:#067647}
.pay-toggle button.on.pay-no{border-color:#B54708;background:#FFFAEB;color:#B54708}
.btn-done{width:100%;margin-top:.8rem;padding:.9rem 1rem;border:0;border-radius:12px;background:#067647;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.oc .tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.25rem}
@media (prefers-reduced-motion:reduce){.todo-bub{animation:none}}
.day.today .dayhead .d{color:var(--brand)}
.day.sel{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.day.sel .dayhead{box-shadow:inset 0 -2px 0 var(--brand)}
.daybody{padding:.55rem;display:grid;gap:.45rem;align-content:start}
.oc{--st:#888;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;text-align:left;display:grid;gap:.15rem;font-size:.82rem;line-height:1.35;box-shadow:0 1px 1px rgba(16,24,40,.04)}
.oc:hover{border-color:var(--brand)}
.oc .t{display:flex;justify-content:space-between;gap:.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.oc .c{font-weight:600}
.oc.canceled{opacity:.5}
.oc .pill{margin-top:.25rem;justify-self:start}
.prep{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.prep h3{font-size:.85rem;color:var(--muted);font-weight:700;margin-bottom:.6rem}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qlist b{font-variant-numeric:tabular-nums}
.note{background:var(--soft);border-radius:10px;padding:.75rem .9rem;margin-bottom:.6rem;font-size:.9rem}
.note p{margin:.2rem 0 0}
.statuses{display:flex;flex-wrap:wrap;gap:.45rem}
.st{--st:#888;height:36px;padding:0 .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:.4rem}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st)}
.st.on{border-color:var(--st);background:color-mix(in srgb,var(--st) 14%,var(--surface))}
.photos{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.photos img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.olines{list-style:none;margin:0 0 1rem;padding:0}
.olines li{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.2rem;margin:0 0 1rem;font-size:.92rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600}

/* produits */
.prod-cell{display:flex;align-items:center;gap:.8rem;min-width:240px}
.pthumb{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--line);background:#F3EFEA}
.pthumb img,.pthumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .art-ph span{font-size:1.5rem;filter:none}
.prod-cell b{display:block}
.prod-cell .muted{display:block;font-size:.8rem;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.algtxt{font-size:.82rem;color:var(--muted);max-width:220px}
.search{position:relative;width:min(280px,100%)}
.search .i{position:absolute;left:.7rem;top:11px;color:var(--muted)}
.search input{padding-left:2.2rem !important}
.chips-edit{display:flex;flex-wrap:wrap;gap:.5rem}
.chip-e{display:inline-flex;align-items:center;gap:.25rem;height:34px;padding:0 .3rem 0 .85rem;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:.88rem}
.chip-e button{border:0;background:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.algs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem}
.algs label{display:flex;gap:.55rem;align-items:center;font-weight:600;font-size:.88rem;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;cursor:pointer}
.algs label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.media-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.media-btns{display:grid;gap:.4rem;justify-items:start}
.ph-prev{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.spin-prev{width:200px;height:150px;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
.spin-prev canvas{width:100%;height:100%;touch-action:none;cursor:grab;display:block}
[data-zoom]{cursor:zoom-in}
.zoom-tag{position:absolute;right:.6rem;top:.6rem;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1C1917;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15);pointer-events:none}
.zoom-tag .i{width:18px;height:18px}
.lb{position:fixed;inset:0;z-index:90;background:#000;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;animation:fadein .18s ease-out;-webkit-user-select:none;user-select:none}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;-webkit-user-drag:none}
.lb canvas{width:min(100%,calc(100vh*4/3));height:auto;max-height:100%;cursor:grab;touch-action:none}
.ph-prev[data-zoom]{background:#000;object-fit:contain}
.bg-mode{display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap}
.bg-mode .field{flex:0 1 260px}
.rgpd-box{display:grid;gap:.5rem;border:1px solid rgba(120,113,108,.3);background:rgba(120,113,108,.07);border-radius:12px;padding:.85rem 1rem}
.rgpd-ok{display:flex;gap:.75rem;align-items:flex-start;font-weight:600;font-size:.95rem;line-height:1.4;cursor:pointer}
.rgpd-ok input[type=checkbox]{width:26px;height:26px;flex:none;margin:0}
.rgpd-box p{margin:0}
.lb-x{position:absolute;top:calc(1rem + env(safe-area-inset-top,0px));right:1rem;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;z-index:2}
.lb-x .i{width:24px;height:24px}
.lb-hint{position:absolute;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:rgba(255,255,255,.8);font-size:.85rem;font-weight:600;background:rgba(0,0,0,.4);padding:.4rem .9rem;border-radius:999px;white-space:nowrap;pointer-events:none}
.v360-prog{display:grid;gap:.4rem;min-width:220px}
.v360-prog progress{width:100%;height:8px;accent-color:var(--brand)}
.sect{border-top:1px solid var(--line);padding-top:1rem}
.sect h3{font-size:.95rem;margin-bottom:.25rem}

/* vitrine */
.brand-grid{display:grid;gap:1.25rem}
@media(min-width:1100px){.brand-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}.brand-grid>.card:last-child{position:sticky;top:1.5rem}}
.cover-prev{width:100%;height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:.7rem}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.swatch{display:flex !important;align-items:center;gap:.65rem;border:1px solid var(--line);border-radius:12px;padding:.55rem .7rem;font-weight:700;font-size:.85rem;cursor:pointer}
.swatch input{width:36px;height:36px;border:0;border-radius:8px;padding:0;background:none;cursor:pointer;flex:none}
.swatch .hex{display:block;font-weight:600;color:var(--muted);font-size:.78rem;text-transform:uppercase}
@media(max-width:560px){.swatches{grid-template-columns:1fr}}

/* appareil (aperçu de la borne) */
.device{background:#1D2125;border-radius:26px;padding:12px;box-shadow:0 30px 60px -30px rgba(15,30,40,.5)}
.device .screen{border-radius:15px;overflow:hidden;position:relative;aspect-ratio:16/10;background:#fff}
.device .scaler{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;pointer-events:none}

/* vidéos */
.pick{display:flex;flex-wrap:wrap;gap:.5rem}
.pickitem{display:flex !important;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:10px;padding:.3rem .8rem .3rem .3rem;font-weight:600;font-size:.88rem;cursor:pointer}
.pickitem input{position:absolute;opacity:0;width:1px;height:1px}
.pickitem:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.pickitem:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.pickitem .pthumb{width:30px;height:30px;border-radius:7px}
.pickitem .pthumb .art-ph span{font-size:1rem}
.scenes{list-style:none;padding:0;margin:0;display:grid}
.scenes li{display:grid;grid-template-columns:56px 1fr;gap:.9rem;padding:.8rem 0;border-top:1px solid var(--line)}
.scenes li:first-child{border-top:0;padding-top:0}
.scenes .sec{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}

.hash{color:var(--brand);font-weight:700;font-size:.9rem;margin:1rem 0 0}
.vp{position:relative;aspect-ratio:9/16;max-height:62vh;margin:0 auto;border-radius:22px;overflow:hidden;background:var(--k-brand)}

.vp-bar{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}

.vp-scene{display:grid;grid-template-rows:minmax(0,1fr) auto auto;padding:2.4rem 1.2rem 1.4rem;gap:.8rem;color:var(--k-on-brand);animation:fadein .35s ease-out}
.vp-vis{display:grid;place-items:center;min-height:0}

.vp-cap{font-size:1.65rem;font-weight:800;line-height:1.15;text-align:center;letter-spacing:-.02em}

.vp-ctl{display:grid;gap:.5rem;justify-items:center;margin-top:1rem;text-align:center}

.vexp{display:grid;gap:.35rem;width:100%;max-width:340px}.vexp[hidden]{display:none}.vexp progress{width:100%;height:8px;accent-color:var(--brand)}
.ideas{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:-.4rem}
.idea{display:inline-flex;align-items:center;gap:.35rem;height:32px;padding:0 .75rem;border-radius:999px;border:1px dashed var(--line);background:var(--soft);font-weight:600;font-size:.82rem;color:var(--ink)}
.idea .i{width:14px;height:14px;color:var(--accent)}
.vopt{display:flex !important;align-items:center;gap:.5rem;font-weight:600;font-size:.88rem;margin-top:.15rem}
.vprompt{margin:.4rem 0 0;color:var(--muted);font-style:italic;max-width:70ch}
.pick-g{display:grid;gap:.35rem;margin-top:.5rem}
.partbar-w{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:.9rem 1.25rem}
.partbar{display:flex;gap:.4rem;flex-wrap:wrap}
.partbar button{display:inline-flex;align-items:center;gap:.45rem;height:38px;padding:0 .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.88rem;color:var(--muted)}
.partbar button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.partbar .cnt{font-size:.75rem;font-weight:800;opacity:.75}
.cat-sec .card-h{position:sticky;top:0;background:var(--surface);z-index:1;border-radius:14px 14px 0 0}
.prep-g+.prep-g{margin-top:1rem}.prep-g h4{margin:0 0 .3rem;font-size:.92rem}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* accueil */
.lp{min-height:100%;background:var(--bg)}
.lp-nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem clamp(1rem,4vw,3rem);max-width:1280px;margin:0 auto}
.lp-nav .links{display:flex;gap:.5rem;flex-wrap:wrap}
.lp-hero{max-width:1280px;margin:0 auto;padding:2.5rem clamp(1rem,4vw,3rem) 3rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:3rem;align-items:center}
.lp-hero h1{font-size:clamp(2.1rem,4.4vw,3.5rem);font-weight:800;letter-spacing:-.035em;line-height:1.06;margin:0 0 1rem}
.lp-hero p{font-size:1.12rem;color:var(--muted);max-width:44ch}
.lp-ctas{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.6rem}
@media(max-width:940px){.lp-hero{grid-template-columns:1fr;gap:2rem}}
.features{max-width:1280px;margin:0 auto;padding:0 clamp(1rem,4vw,3rem) 2rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.feat{padding:1.3rem}
.feat .fic{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:.9rem}
.feat h3{font-size:1rem;margin:0 0 .3rem}
.feat p{color:var(--muted);margin:0;font-size:.92rem}
.lp-demo{max-width:1280px;margin:0 auto;padding:0 clamp(1rem,4vw,3rem) 4rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.shoprow{display:flex;align-items:center;gap:.8rem;padding:.8rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.shoprow:first-child{border-top:0}
.shoprow b{margin-right:auto}
.cred{display:grid;grid-template-columns:max-content 1fr;gap:.45rem 1.2rem;margin:0 0 1rem;font-size:.92rem}
.cred dt{color:var(--muted);font-weight:600}
.cred dd{margin:0;font-weight:700}

.kicker{display:inline-block;font-weight:800;font-size:.85rem;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:.35rem .8rem;margin-bottom:1rem}
.lp-sec{max-width:1280px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,3rem)}
.lp-sec>h2{font-size:clamp(1.4rem,2.6vw,1.9rem);letter-spacing:-.025em;margin-bottom:1.1rem}
.lp-sec .features{padding:0;max-width:none}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.steps li{padding:1.3rem}
.steps h3{font-size:1.02rem;margin:.8rem 0 .3rem}
.steps p{color:var(--muted);margin:0;font-size:.92rem}
.stepn{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800}
.plans td:not(:first-child),.plans th:not(:first-child){text-align:center;width:22%}
.plans td:first-child{font-weight:600}
.yes{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand)}
.yes .i{width:15px;height:15px}
.lp-foot{max-width:1280px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,3rem) 2.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;border-top:1px solid var(--line)}
.lp-demo{padding-top:1.5rem !important}
.nbadge{margin-left:auto;min-width:20px;height:20px;padding:0 .4rem;border-radius:999px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center}
.segtog{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-right:.4rem}
.segtog button{display:inline-flex;align-items:center;gap:.4rem;height:32px;padding:0 .75rem;border:0;border-radius:8px;background:none;font-weight:700;font-size:.85rem;color:var(--muted)}
.segtog button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.segtog .i{width:16px;height:16px}
.weeknav{flex-wrap:wrap}
.share-grid{display:grid;gap:1.25rem}
@media(min-width:1100px){.share-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.linkbox{display:flex;align-items:center;gap:.6rem;border:1px solid var(--line);border-radius:10px;padding:0 .3rem 0 .8rem;background:var(--soft)}
.linkbox input{border:0 !important;background:transparent !important;box-shadow:none !important;padding:0 !important;font-weight:600 !important;color:var(--ink)}
.linkico{color:var(--muted);display:grid}
.note{background:var(--soft);border-radius:10px;padding:.8rem .95rem;color:var(--ink);margin:0}
.nets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem}
.net{--nc:#667085;display:flex;align-items:center;gap:.6rem;height:44px;padding:0 .9rem;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-weight:700;font-size:.9rem;background:var(--surface)}
.net:hover{border-color:var(--nc)}
.net .dotc{width:10px;height:10px;border-radius:50%;background:var(--nc);flex:none}
.net .i{margin-left:auto;width:15px;height:15px;color:var(--muted)}
.poster-wrap{background:var(--soft);border-radius:12px;padding:1rem;display:grid;place-items:center}
.poster-wrap canvas{width:min(100%,360px);height:auto;border-radius:6px;box-shadow:0 12px 30px -14px rgba(0,0,0,.35);background:#fff}
.a-shop{font-size:clamp(1.4rem,3.6vw,2.2rem) !important}
.a-top .k-logo{width:clamp(52px,6vw,66px);height:clamp(52px,6vw,66px);border-radius:clamp(14px,1.8vw,19px)}
.a-hours{display:inline-flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.92);font-weight:700;font-size:clamp(.95rem,1.8vw,1.1rem);text-shadow:0 1px 8px rgba(0,0,0,.35)}
.a-card.nocover .a-hours{color:var(--k-on-brand);text-shadow:none}

/* connexion */
.auth{min-height:100%;display:grid;place-items:center;padding:2rem 1rem}
.auth-in{width:min(440px,100%)}
.auth-in.wide{width:min(560px,100%)}
.auth-logo{display:flex;align-items:center;gap:.6rem;margin-bottom:1.5rem;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;text-decoration:none}
.auth .card-b h1{font-size:1.4rem}
.codebox{margin-top:1.1rem;padding:1.1rem 1.2rem;border-radius:12px;background:var(--soft);border:1px solid var(--line);display:grid;gap:.5rem}
.codebox .big{font-size:clamp(1.5rem,5vw,2rem);font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* ============ borne ============ */
.kiosk{
  --surface:#FFFFFF; --ink:#1C1917; --muted:#6B6460; --line:#E7E5E4; --soft:#F5F5F4;
  --brand:var(--k-brand); --on-brand:var(--k-on-brand); --brand-soft:color-mix(in srgb,var(--k-brand) 10%,#fff); --accent:var(--k-accent);
  position:relative;height:100%;display:flex;flex-direction:column;background:var(--k-bg);color:var(--k-ink);font-size:16px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden
}
.kiosk input,.kiosk textarea{-webkit-user-select:text;user-select:text}
.k-top{display:flex;align-items:center;gap:1rem;padding:.85rem 1.5rem;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);flex:none}
.k-logo{width:48px;height:48px;border-radius:12px;background:var(--k-brand) center/cover no-repeat;color:var(--k-on-brand);display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:none}
.k-shop{min-width:0}
.k-shop b{display:block;font-size:1.2rem;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.k-shop span{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-top-act{margin-left:auto;display:flex;gap:.6rem;align-items:center;flex:none}
.k-pillbtn{line-height:1;height:48px;padding:0 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;display:inline-flex;gap:.5rem;align-items:center;white-space:nowrap}
.k-pillbtn .n{background:var(--k-accent);color:var(--k-on-accent);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.78rem;padding:0 .35rem}
.k-lock{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);opacity:.4;display:grid;place-items:center}
.k-lock:hover,.k-lock:focus-visible{opacity:1}
.k-lock-abs{position:absolute;right:1rem;top:1rem;color:#fff;background:rgba(0,0,0,.18);z-index:2}
.k-body{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr) 380px}
.k-rail{overflow-y:auto;padding:1rem .75rem;display:flex;flex-direction:column;gap:.3rem;border-right:1px solid color-mix(in srgb,var(--k-ink) 10%,transparent)}
.k-rail button{min-height:56px;text-align:left;padding:.55rem 1rem;border-radius:12px;border:0;background:transparent;color:var(--k-ink);font-weight:700;font-size:1rem}
.k-rail button.on{background:var(--k-brand);color:var(--k-on-brand)}
.k-main{overflow-y:auto;padding:1.25rem 1.5rem 2rem;overscroll-behavior:contain}
.k-sec{font-size:1.3rem;font-weight:800;margin:1.6rem 0 .85rem;color:var(--k-ink);letter-spacing:-.015em}
.k-main>.k-sec:first-child{margin-top:0}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:1rem}
.k-card{position:relative;background:#fff;color:#1C1917;border-radius:16px;overflow:hidden;border:1px solid #E7E5E4;display:flex;flex-direction:column;cursor:pointer;transition:transform .1s}
.k-card:active{transform:scale(.985)}
.k-media{aspect-ratio:4/3;position:relative;overflow:hidden;background:#000}
.k-media img{width:100%;height:100%;object-fit:contain;display:block}
.k-media canvas{width:100%;height:100%;display:block}
.art-ph{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(120% 95% at 50% 40%,#2A2725 0%,#0E0D0C 60%,#000 100%)}
.art-ph span{font-size:clamp(3.2rem,5.5vw,4.4rem);line-height:1;filter:drop-shadow(0 10px 18px rgba(255,255,255,.12))}
.k-info{padding:.8rem .9rem .9rem;display:flex;flex-direction:column;gap:.2rem;flex:1}
.k-name{font-weight:700;font-size:1rem;line-height:1.3}
.k-desc{color:#78716C;font-size:.83rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:.55rem}
.k-price{font-weight:800;font-size:1.08rem;font-variant-numeric:tabular-nums}
.k-add{width:44px;height:44px;border-radius:50%;border:0;background:var(--k-brand);color:var(--k-on-brand);display:grid;place-items:center}
.k-add .i{width:22px;height:22px}
.k-tag{position:absolute;left:.6rem;top:.6rem;background:rgba(255,255,255,.94);color:#1C1917;border-radius:999px;height:26px;padding:0 .6rem;font-size:.75rem;font-weight:800;display:inline-flex;gap:.3rem;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.k-tag .i{width:14px;height:14px}
.k-feature{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--k-brand);color:var(--k-on-brand);border-radius:18px;overflow:hidden;cursor:pointer;min-height:210px}
.k-feature .ft{padding:1.6rem 1.8rem;display:flex;flex-direction:column;gap:.5rem;justify-content:center}
.k-feature .eyebrow{font-size:.85rem;font-weight:700;opacity:.75}
.k-feature h3{font-size:1.65rem;margin:0;letter-spacing:-.02em}
.k-feature p{opacity:.85;margin:0;max-width:40ch}
.k-feature .from{font-size:.85rem;font-weight:700;opacity:.8}
.k-feature .cta{margin-top:.7rem;white-space:nowrap;align-self:flex-start;background:var(--k-accent);color:var(--k-on-accent);border-radius:999px;height:48px;padding:0 1.3rem;display:inline-flex;align-items:center;font-weight:800}
.k-feature .fv{overflow:hidden;min-height:0;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.2),transparent 68%);display:grid;place-items:center}
.k-feature .fv canvas{width:100%;height:100%;max-height:260px;object-fit:contain}
@media(max-width:600px){.k-feature{grid-template-columns:1fr}.k-feature .fv{height:170px;order:-1}.k-feature .fv canvas{height:170px;width:auto;max-width:100%}}
.k-empty{padding:3rem 1rem;text-align:center;color:var(--k-ink);opacity:.75}
.k-order{background:#fff;color:#1C1917;border-left:1px solid #E7E5E4;display:flex;flex-direction:column;min-height:0}
.k-order-h{padding:1.1rem 1.25rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.k-order-h h2{font-size:1.15rem;margin:0}
.k-order-list{flex:1;overflow-y:auto;padding:0 1.25rem}
.k-line{display:grid;grid-template-columns:56px minmax(0,1fr);gap:.85rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.k-line:last-child{border-bottom:0}
.k-line .thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:#F3EFEA}
.k-line .thumb img,.k-line .thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.k-line .thumb .art-ph span{font-size:1.9rem}
.k-line .r1{display:flex;justify-content:space-between;gap:.5rem;font-weight:700;line-height:1.3}
.k-line .r1 .num{white-space:nowrap}
.k-line .sub{color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:.15rem}
.k-line .r2{display:flex;justify-content:space-between;align-items:center;margin-top:.45rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff}
.qty button{width:38px;height:38px;border:0;background:none;display:grid;place-items:center;border-radius:50%;color:#1C1917}
.qty button .i{width:16px;height:16px}
.qty span{min-width:2.2ch;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.qty.lg button{width:52px;height:52px}
.qty.lg button .i{width:20px;height:20px}
.qty.lg span{font-size:1.2rem}
.k-order-f{padding:1rem 1.25rem 1.25rem;border-top:1px solid var(--line);display:grid;gap:.8rem}
.k-total{display:flex;justify-content:space-between;align-items:baseline;font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.k-total span:first-child{font-size:1rem;font-weight:700}
.k-empty-order{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;color:var(--muted);padding:2rem;gap:.2rem}
.k-empty-order .i{width:40px;height:40px;margin-bottom:.6rem;opacity:.6}
.k-empty-order strong{color:#1C1917}
.k-cta{height:60px;border-radius:14px;border:0;background:var(--k-brand);color:var(--k-on-brand);font-weight:800;font-size:1.08rem;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:0 1.4rem}
.k-cta:disabled{opacity:.4}
.k-cartbar{display:none}
@media(max-width:1180px){
  .k-body{grid-template-columns:200px minmax(0,1fr)}
  .k-order{display:none}
  .k-cartbar{display:flex;flex:none;margin:.75rem 1rem;height:64px;border-radius:16px;border:0;background:var(--k-brand);color:var(--k-on-brand);justify-content:space-between;align-items:center;padding:0 1.3rem;font-weight:800;font-size:1.05rem;gap:1rem}
  .k-cartbar>span{display:inline-flex;align-items:center;gap:.6rem}
  .k-cartbar .cnt{background:var(--k-accent);color:var(--k-on-accent);border-radius:999px;min-width:26px;height:26px;padding:0 .4rem;display:inline-grid;place-items:center;font-size:.85rem}
}
@media(max-width:760px){
  .k-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .k-rail{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid color-mix(in srgb,var(--k-ink) 10%,transparent);padding:.6rem 1rem;scrollbar-width:none}
  .k-rail button{min-height:44px;white-space:nowrap;padding:.4rem 1rem}
  .k-main{padding:1rem}
  .k-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.75rem}
  .k-top{padding:.65rem 1rem;gap:.7rem}
  .k-shop,.k-pillbtn .lbl{display:none}
  .kiosk.is-web .k-shop{display:block}
  .kiosk.is-web .k-shop span{display:none}
  .k-top-act{gap:.4rem}
  .k-pillbtn{width:48px;padding:0;justify-content:center;position:relative}
  .k-pillbtn .n{position:absolute;top:-4px;right:-4px}
  .k-logo{width:40px;height:40px}
}
.attract{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;background:var(--k-brand) center/cover no-repeat;color:#fff;cursor:pointer}
.attract::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.68) 100%)}
.attract.nocover{color:var(--k-on-brand)}

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   Prox-e — Animation de confirmation de commande
   Fichier autonome : aucune librairie, gratuit, léger.

   Utilisation (après validation de la commande) :
     ProxeConfirmation.show({
       numero: "A-042",              // numéro de commande
       articles: [{ nom: "Layer cake 8 parts", qte: 1, prix: 32 }],
       total: 32,
       retrait: "Samedi 31 oct. à 10h",
       email: "client@mail.fr",      // facultatif : affiche "e-mail envoyé"
       delaiRetourAccueil: 12,       // secondes avant retour à l'accueil (borne)
       onClose: () => afficherAccueil()  // retour à l'écran d'accueil
     });
   ========================================================= */
(function () {
  const C = {
    brun: "#4a2c1d",
    caramel: "#c8874a",
    beige: "#f1e3cc",
    creme: "#fffaf2",
    noir: "#0e0a08",
  };

  const css = `
  .pxc-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, #2a1a12 0%, ${C.noir} 70%);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    opacity:0;transition:opacity .35s ease;overflow:hidden}
  .pxc-overlay.pxc-on{opacity:1}
  .pxc-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* Ticket */
  .pxc-ticket{position:relative;width:min(340px,82vw);background:${C.creme};color:${C.brun};border-radius:14px 14px 0 0;
    padding:22px 22px 30px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:translateY(40px) scale(.9);opacity:0;
    animation:pxc-in .5s cubic-bezier(.2,.9,.3,1.2) forwards}
  .pxc-ticket::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;
    background:linear-gradient(-45deg,transparent 8px,${C.creme} 0) 0 0/16px 12px,
               linear-gradient(45deg,transparent 8px,${C.creme} 0) 0 0/16px 12px;}
  .pxc-ticket h3{margin:0 0 4px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:${C.caramel}}
  .pxc-ticket .pxc-num{font-size:28px;font-weight:800;margin-bottom:12px}
  .pxc-ticket ul{list-style:none;margin:0;padding:10px 0;border-top:1px dashed #d8c4a6;border-bottom:1px dashed #d8c4a6;font-size:14px}
  .pxc-ticket li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
  .pxc-ticket .pxc-tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin-top:10px}
  .pxc-ticket.pxc-fly{animation:pxc-fly 1.1s cubic-bezier(.55,0,.4,1) forwards}

  @keyframes pxc-in{to{transform:translateY(0) scale(1);opacity:1}}
  @keyframes pxc-fly{
    0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
    25%{transform:translate(0,30px) rotate(-4deg) scale(.95)}
    100%{transform:translate(60vw,-90vh) rotate(28deg) scale(.15);opacity:0}}

  /* Écran merci */
  .pxc-merci{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center;color:${C.beige};
    padding:0 24px;opacity:0;transform:scale(.92);transition:all .5s cubic-bezier(.2,.9,.3,1.2)}
  .pxc-merci.pxc-on{opacity:1;transform:scale(1)}
  .pxc-check{width:110px;height:110px;margin-bottom:18px}
  .pxc-check circle{fill:none;stroke:${C.caramel};stroke-width:5;stroke-dasharray:320;stroke-dashoffset:320}
  .pxc-check path{fill:none;stroke:${C.beige};stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80}
  .pxc-merci.pxc-on .pxc-check circle{animation:pxc-draw .6s ease-out forwards}
  .pxc-merci.pxc-on .pxc-check path{animation:pxc-draw .4s .5s ease-out forwards}
  @keyframes pxc-draw{to{stroke-dashoffset:0}}
  .pxc-merci h2{margin:0;font-size:clamp(30px,6vw,46px);color:#fff}
  .pxc-merci p{margin:8px 0 0;font-size:clamp(15px,2.4vw,19px);opacity:.85;max-width:520px}
  .pxc-badge{margin:20px 0 6px;padding:14px 28px;border-radius:16px;background:${C.caramel};color:${C.noir};
    font-weight:800;font-size:clamp(26px,5vw,38px);letter-spacing:.04em}
  .pxc-small{font-size:14px!important;opacity:.6!important;margin-top:22px!important}
  .pxc-btn{margin-top:22px;padding:14px 34px;border:0;border-radius:999px;background:${C.beige};color:${C.brun};
    font-weight:700;font-size:17px;cursor:pointer}

  @media (prefers-reduced-motion: reduce){
    .pxc-ticket,.pxc-ticket.pxc-fly{animation:none;opacity:1;transform:none}
    .pxc-merci,.pxc-overlay{transition:none}
  }`;

  function injectCss() {
    if (document.getElementById("pxc-style")) return;
    const s = document.createElement("style");
    s.id = "pxc-style";
    s.textContent = css;
    document.head.appendChild(s);
  }

  const euro = (n) => Number(n || 0).toFixed(2).replace(".", ",") + " €";
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* Confettis légers aux couleurs Prox-e (canvas maison) */
  function confettis(canvas) {
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const W = (canvas.width = innerWidth * dpr);
    const H = (canvas.height = innerHeight * dpr);
    const couleurs = [C.caramel, C.beige, "#e8b07a", "#ffffff"];
    const parts = Array.from({ length: 110 }, () => ({
      x: W / 2 + (Math.random() - 0.5) * W * 0.2,
      y: H * 0.45,
      vx: (Math.random() - 0.5) * 16 * dpr,
      vy: (-Math.random() * 15 - 6) * dpr,
      r: (Math.random() * 5 + 3) * dpr,
      a: Math.random() * Math.PI,
      va: (Math.random() - 0.5) * 0.3,
      c: couleurs[(Math.random() * couleurs.length) | 0],
    }));
    let frame = 0;
    (function loop() {
      ctx.clearRect(0, 0, W, H);
      parts.forEach((p) => {
        p.vy += 0.35 * dpr; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - frame / 160);
        ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
        ctx.restore();
      });
      if (++frame < 160) requestAnimationFrame(loop);
      else ctx.clearRect(0, 0, W, H);
    })();
  }

  function show(opts = {}) {
    injectCss();
    const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const articles = opts.articles || [];
    const delai = opts.delaiRetourAccueil ?? 12;

    const ov = document.createElement("div");
    ov.className = "pxc-overlay";
    ov.setAttribute("role", "dialog");
    ov.setAttribute("aria-live", "polite");
    ov.innerHTML = `
      <canvas class="pxc-canvas"></canvas>
      <div class="pxc-ticket">
        <h3>Votre commande</h3>
        <div class="pxc-num">N° ${esc(opts.numero)}</div>
        <ul>${articles.map((a) => `<li><span>${esc(a.qte)} × ${esc(a.nom)}</span><span>${euro(a.prix * a.qte)}</span></li>`).join("")}</ul>
        <div class="pxc-tot"><span>Total</span><span>${euro(opts.total)}</span></div>
      </div>
      <div class="pxc-merci">
        <svg class="pxc-check" viewBox="0 0 110 110"><circle cx="55" cy="55" r="50"/><path d="M33 57 l15 15 l30 -32"/></svg>
        <h2>Merci${opts.client ? " " + esc(opts.client) : ""} !</h2>
        <p>Votre commande est partie en préparation.</p>
        <div class="pxc-badge">N° ${esc(opts.numero)}</div>
        ${opts.retrait ? `<p>Retrait : <strong>${esc(opts.retrait)}</strong></p>` : ""}
        <p>Règlement en boutique : <strong>${euro(opts.total)}</strong></p>
        ${opts.email ? `<p>Un récapitulatif vous a été envoyé à <strong>${esc(opts.email)}</strong></p>` : ""}
        <button class="pxc-btn" type="button">Terminer</button>
        <p class="pxc-small">Retour à l'accueil dans <span class="pxc-cpt">${delai}</span> s</p>
      </div>`;
    document.body.appendChild(ov);

    const ticket = ov.querySelector(".pxc-ticket");
    const merci = ov.querySelector(".pxc-merci");
    const cpt = ov.querySelector(".pxc-cpt");
    let timer;

    function fermer() {
      clearInterval(timer);
      ov.classList.remove("pxc-on");
      setTimeout(() => { ov.remove(); opts.onClose && opts.onClose(); }, 350);
    }
    ov.querySelector(".pxc-btn").addEventListener("click", fermer);

    requestAnimationFrame(() => ov.classList.add("pxc-on"));

    const afficherMerci = () => {
      ticket.remove();
      merci.classList.add("pxc-on");
      if (!reduit) confettis(ov.querySelector(".pxc-canvas"));
      let reste = delai;
      timer = setInterval(() => {
        reste--; cpt.textContent = reste;
        if (reste <= 0) fermer();
      }, 1000);
    };

    if (reduit) { setTimeout(afficherMerci, 900); return; }
    // 1) le ticket apparaît, 2) il s'envole, 3) écran merci + confettis
    setTimeout(() => ticket.classList.add("pxc-fly"), 1400);
    setTimeout(afficherMerci, 2300);
  }

  window.ProxeConfirmation = { show };
})();

</script>

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=c=>(c/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const newId=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():uid()+uid();
const pad=n=>String(n).padStart(2,'0');
function dayKey(d){const x=new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const fmtT=iso=>new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const fmtD=iso=>new Date(iso).toLocaleDateString('fr-FR');
const fmtDT=iso=>new Date(iso).toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function slugify(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);}
function initials(n){return String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';}
function lum(hex){const c=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
function contrast(a,b){const A=lum(a),B2=lum(b);return (Math.max(A,B2)+0.05)/(Math.min(A,B2)+0.05);}
let toastTimer;
let CURFORM=null;
function toast(m){if(CURFORM&&CURFORM.isConnected){let pe=CURFORM.querySelector('.ferr');if(!pe){pe=document.createElement('p');pe.className='err ferr';pe.setAttribute('role','alert');CURFORM.appendChild(pe);}pe.textContent=m;}const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),7000);}
function copyText(txt){try{navigator.clipboard.writeText(txt).then(()=>toast('Copié dans le presse-papiers.'),()=>toast('Copie impossible ici : sélectionnez le texte à la main.'));}catch(e){toast('Copie impossible ici : sélectionnez le texte à la main.');}}
/* vidéo -> images pour la vue 360° (rien n'est envoyé tant que le produit n'est pas enregistré) */
function videoToFrames(file,n,max,onStep){return new Promise((res,rej)=>{
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';
  const url=URL.createObjectURL(file);let done=false;
  const fail=m=>{if(done)return;done=true;URL.revokeObjectURL(url);rej(new Error(m));};
  const seek=t=>new Promise((ok,ko)=>{const to=setTimeout(()=>ko(new Error('Lecture de la vidéo trop lente sur cet appareil.')),10000);v.onseeked=()=>{clearTimeout(to);ok();};v.currentTime=t;});
  v.onerror=()=>fail('Cette vidéo n’a pas pu être lue. Essayez une vidéo filmée avec l’appareil photo du téléphone (MP4 ou MOV).');
  v.onloadeddata=async()=>{if(done)return;
    try{const d=v.duration;if(!isFinite(d)||d<=0)return fail('Durée de la vidéo illisible.');
      if(d<2)return fail('Vidéo trop courte : filmez au moins 3 secondes.');

function drawCake(ctx,w,h,a){
  ctx.clearRect(0,0,w,h);
  const TAU=Math.PI*2,cx=w/2,rx=w*0.34,ry=rx*0.34,H=h*0.26,top=h*0.39,bot=top+H;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.10)';ctx.beginPath();ctx.ellipse(cx,bot+ry*0.45,rx*1.34,ry*1.3,0,0,TAU);ctx.fill();
  ctx.fillStyle='#FFFFFF';ctx.strokeStyle='#D9D3C9';ctx.lineWidth=Math.max(1,w/300);ctx.beginPath();ctx.ellipse(cx,bot+ry*0.2,rx*1.26,ry*1.22,0,0,TAU);ctx.fill();ctx.stroke();
  const band=(y0,y1,fill)=>{ctx.beginPath();ctx.moveTo(cx-rx,y0);ctx.lineTo(cx-rx,y1);ctx.ellipse(cx,y1,rx,ry,0,Math.PI,0,true);ctx.lineTo(cx+rx,y0);ctx.ellipse(cx,y0,rx,ry,0,0,Math.PI,false);ctx.closePath();ctx.fillStyle=fill;ctx.fill();};
  band(top,bot,'#F7EEDD');
  band(top+H*0.10,top+H*0.22,'#E8C27C');
  band(bot-H*0.20,bot,'#E8C27C');
  band(top,top+H*0.10,'#EE9DB0');
  const side=[];
  for(let k=0;k<14;k++){const th=k/14*TAU+a;const s=Math.sin(th);if(s>0.02)side.push({x:cx+rx*Math.cos(th),s});}
  side.sort((p,q)=>p.s-q.s).forEach(({x,s})=>{const y=top+H*0.51+ry*s;const sw=Math.max(0.18,s);
    ctx.fillStyle='#D3263E';ctx.beginPath();ctx.ellipse(x,y,rx*0.115*sw,H*0.25,0,0,TAU);ctx.fill();
    ctx.fillStyle='#F7B6C0';ctx.beginPath();ctx.ellipse(x,y+H*0.02,rx*0.06*sw,H*0.15,0,0,TAU);ctx.fill();});
  const g=ctx.createLinearGradient(cx-rx,0,cx+rx,0);
  g.addColorStop(0,'rgba(60,30,20,0.24)');g.addColorStop(0.3,'rgba(60,30,20,0)');g.addColorStop(0.45,'rgba(255,255,255,0.2)');g.addColorStop(0.6,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(60,30,20,0.28)');
  band(top,bot,g);
  ctx.fillStyle='#F4AFC0';ctx.beginPath();ctx.ellipse(cx,top,rx,ry,0,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';ctx.beginPath();ctx.ellipse(cx-rx*0.2,top-ry*0.25,rx*0.45,ry*0.35,0,0,TAU);ctx.fill();
  const items=[];
  for(let k=0;k<9;k++){const th=k/9*TAU+a;items.push({f:true,x:cx+rx*0.74*Math.cos(th),y:top+ry*0.74*Math.sin(th),d:Math.sin(th)});}
  const tp=a+Math.PI*0.5;items.push({f:false,x:cx+rx*0.12*Math.cos(tp),y:top+ry*0.12*Math.sin(tp),d:Math.sin(tp)*0.12,c:Math.cos(a)});
  items.sort((p,q)=>p.d-q.d).forEach(it=>{
    if(it.f){const sc=0.85+0.15*it.d;
      ctx.fillStyle='#C3132D';ctx.beginPath();ctx.ellipse(it.x,it.y-H*0.1*sc,rx*0.085*sc,H*0.12*sc,0,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.ellipse(it.x-rx*0.025,it.y-H*0.14*sc,rx*0.02,H*0.035,0,0,TAU);ctx.fill();
      ctx.fillStyle='#3E8E35';ctx.beginPath();ctx.ellipse(it.x,it.y-H*0.21*sc,rx*0.06*sc,H*0.035,0,0,TAU);ctx.fill();}
    else{const pw=rx*0.5*(0.45+0.55*Math.abs(it.c)),ph=H*0.2;
      ctx.fillStyle='#5A3626';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(it.x-pw/2,it.y-ph,pw,ph,ph*0.2);else ctx.rect(it.x-pw/2,it.y-ph,pw,ph);ctx.fill();
      ctx.strokeStyle='#F7EEDD';ctx.lineWidth=Math.max(1,w/260);ctx.beginPath();ctx.moveTo(it.x-pw*0.32,it.y-ph*0.5);ctx.bezierCurveTo(it.x-pw*0.1,it.y-ph*0.85,it.x+pw*0.05,it.y-ph*0.15,it.x+pw*0.32,it.y-ph*0.5);ctx.stroke();}
  });
  ctx.restore();
}
function mountSpinner(cv,p){
  const rc=cv.getBoundingClientRect();
  if(rc.width>40){const dpr=Math.min(2,window.devicePixelRatio||1);const W=Math.min(2400,Math.round(rc.width*dpr));const H=Math.round(W*cv.height/cv.width);if(W>cv.width){cv.width=W;cv.height=H;}}
  const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  const useFrames=p.frames&&p.frames.length>=8;
  const N=useFrames?p.frames.length:36;
  let idx=0,drag=null,auto=null;
  const imgs=useFrames?p.frames.map(src=>{const im=new Image();im.decoding='async';im.onload=()=>{if(im===imgs[idx])draw();};im.src=src;return im;}):null;
  function draw(){
    if(imgs){const im=imgs[idx];if(im.complete&&im.naturalWidth){ctx.clearRect(0,0,cv.width,cv.height);const r=Math.min(cv.width/im.naturalWidth,cv.height/im.naturalHeight);const w=im.naturalWidth*r,h=im.naturalHeight*r;ctx.drawImage(im,(cv.width-w)/2,(cv.height-h)/2,w,h);}}
    else drawCake(ctx,cv.width,cv.height,idx/N*Math.PI*2);
  }
  const stopAuto=()=>{if(auto){clearInterval(auto);auto=null;}};
  const startAuto=()=>{stopAuto();auto=setInterval(()=>{idx=(idx+1)%N;draw();},useFrames?Math.round(3600/N):70);TIMERS.push(auto);};
  draw();
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,i:idx};try{cv.setPointerCapture(e.pointerId);}catch(_){}stopAuto();});
  cv.addEventListener('pointermove',e=>{if(!drag)return;const d=Math.round((e.clientX-drag.x)/7);idx=((drag.i-d)%N+N)%N;draw();});
  const end=()=>{drag=null;};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)startAuto();
  const btn=cv.parentElement.querySelector('[data-spin-toggle]');
  if(btn)btn.onclick=()=>{if(auto)stopAuto();else startAuto();};
}

/* ---------- gâteau sur-mesure en 3D (bannière de la borne) ---------- */
const K3={vis:false,yaw:.6,yawV:0,raf:0,last:0};
const k3FS=()=>H3_FS.replace('uK>8.5','uK>19.5').replace('else{col*=.9+.15*n3(vO*30.);rough=.35;spec=.35;sss=.5;}',
 `else if(uK<8.5){col*=.9+.15*n3(vO*30.);rough=.35;spec=.35;sss=.5;}
 else if(uK<9.5){float a=atan(vO.z,vO.x),r=length(vO.xz);float s=smoothstep(-.15,.15,sin(a*2.-r*34.));col=mix(vec3(1.,.97,.96),vec3(.83,.55,.72),s*smoothstep(.02,.06,r));rough=.45;spec=.35;sss=.6;}

function k3Mesh(g,k,col){const gl=K3.gl;const mk=(d,t)=>{const b=gl.createBuffer();gl.bindBuffer(t,b);gl.bufferData(t,d,gl.STATIC_DRAW);return b;};

  return{pb:mk(g.p,gl.ARRAY_BUFFER),nb:mk(g.n,gl.ARRAY_BUFFER),ib:mk(big?new Uint32Array(g.i):new Uint16Array(g.i),gl.ELEMENT_ARRAY_BUFFER),cnt:g.i.length,it:big?gl.UNSIGNED_INT:gl.UNSIGNED_SHORT,k,c:H3_LIN(col),seed:0};}
/* forme quelconque (cœur…) : contour × profil de dôme */
function g3Shape(outline,prof,n){return g3Grid(prof.length,n,(j,i)=>{const[s,y]=prof[j];const[x,z]=outline(i/n);return[x*s,y,z*s];},true);}
function g3Box(w,h,d){const p=[],ix=[],x=w/2,z=d/2;
  const f=(a,b,c,dd)=>{const o=p.length/3;p.push(...a,...b,...c,...dd);ix.push(o,o+1,o+2,o,o+2,o+3);};
  f([-x,h,-z],[-x,h,z],[x,h,z],[x,h,-z]);f([-x,0,z],[x,0,z],[x,h,z],[-x,h,z]);f([x,0,-z],[-x,0,-z],[-x,h,-z],[x,h,-z]);
  f([-x,0,-z],[-x,0,z],[-x,h,z],[-x,h,-z]);f([x,0,z],[x,0,-z],[x,h,-z],[x,h,z]);
  const P=new Float32Array(p);return{p:P,i:ix,n:g3Normals(P,ix)};}

function k3Build(){

  S.body=k3Mesh(g3Lathe(g3Cyl(R,H,.06,.04),120,(r,y,a)=>[r*(1+.004*Math.sin(a*9)),y]),2,'#F2D3D6');
  /* coulure de chocolat blanc */
  const drips=[];for(let d=0;d<24;d++)drips.push([d/24*Math.PI*2+rnd()*.15,.22+rnd()*.38,.055+rnd()*.035]);
  const dl=a=>{let L=.08;for(const[c,l,w]of drips){let x=Math.abs(a-c);x=Math.min(x,Math.PI*2-x);L+=l*Math.exp(-(x*x)/(w*w));}return L;};
  const rows=18,top=H+.04;

    if(j<4){const u=j/3;r=(R+.02)*Math.sin(u*Math.PI/2)**.6;y=top+.04-.02*u*u;if(j===0)r=0;}
    else{const v=(j-4)/(rows-1),L=dl(a);y=top+.02-v*L;r=R+.02+.025*Math.sin(Math.min(1,v*1.12)*Math.PI)*(L>.25?1:.4);if(j===rows+3)r=R-.01;}
    return[r*Math.cos(a),y,r*Math.sin(a)];},true),3,'#F3E2B4');
  /* meringues en étoile (douilles cannelées) */
  const star=g3Lathe(Array.from({length:16},(_,j)=>{const y=j/15;return[.17*(1-Math.pow(y,1.6))*(1+.25*Math.sin(Math.PI*y*.9))+.004,y*.26];}),48,(r,y,a)=>[r*(1+.22*Math.max(0,Math.cos(8*(a+y*5)))),y]);
  S.star=['#E79AAE','#F2BCC8','#FFF5F2','#E58AA2'].map(c=>k3Mesh(star,7,c));
  /* macarons ronds et cœurs */
  const shellP=[[0,0],[.98,0],[1,.06],[1,.2],[.86,.4],[.5,.52],[0,.55]];
  const round=t=>[Math.cos(t*Math.PI*2)*.24,Math.sin(t*Math.PI*2)*.24];
  const heart=t=>{const a=t*Math.PI*2,x=16*Math.pow(Math.sin(a),3),z=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);return[x*.0175,z*.0175+.03];};
  const mac=(ol,col,fill)=>{const sh=g3Shape(ol,shellP.map(([s,y])=>[s,y*.2]),64),ft=g3Shape(ol,[[.98,-.01],[1.05,0],[1.07,.03],[1.02,.05],[.95,.05]],64);
    return{top:k3Mesh(sh,7,col),bot:k3Mesh(g3MirrorY(sh),7,col),ft:k3Mesh(ft,7,col),ftb:k3Mesh(g3MirrorY(ft),7,col),fill:k3Mesh(g3Shape(ol,[[0,-.035],[.9,-.035],[.92,0],[.9,.035],[0,.035]],64),2,fill)};};
  S.heart=mac(heart,'#E2785E','#F6E4D2');S.round=mac(round,'#F2DFB4','#FFF4DC');
  /* sucettes meringuées en spirale et billes meringuées */
  S.swirl=k3Mesh(g3Lathe([[0,-.07],[.12,-.065],[.19,-.04],[.21,0],[.19,.04],[.12,.065],[0,.07]],48),9,'#FFFFFF');
  S.ball=k3Mesh(g3Sphere(.075,14),10,'#FFFFFF');
  S.medal=k3Mesh(g3Lathe(g3Cyl(.3,.05,.015,0),64,(r,y,a)=>[r,y+(r<.24&&r>.2?.006:0)]),6,'#4B2A1D');
  /* composition du dessus, inspirée de la création réelle */
  const it=S.items,yT=top+.03;
  for(let k=0;k<30;k++){const a=k*2.399+rnd()*.3,rr=.12+Math.sqrt((k+.5)/30)*.74;it.push({m:'star',c:k%4,x:Math.cos(a)*rr,z:Math.sin(a)*rr,y:yT+(1-rr)*.16,s:.95+rnd()*.4,ry:rnd()*6,rx:(rnd()-.5)*.5});}
  it.push({m:'heart',x:-.32,z:.28,y:yT+.38,rx:-1.2,ry:.4,s:1},{m:'heart',x:.25,z:-.35,y:yT+.4,rx:-1.25,ry:-.3,s:1},{m:'heart',x:.45,z:.12,y:yT+.34,rx:-1.1,ry:1.3,s:.95});
  it.push({m:'round',x:-.45,z:-.25,y:yT+.34,rx:-1.25,ry:-.9,s:1},{m:'round',x:.62,z:-.3,y:yT+.28,rx:-1.0,ry:2.1,s:.95});
  it.push({m:'swirl',x:-.62,z:.18,y:yT+.3,rx:1.3,ry:.8,s:1},{m:'swirl',x:.05,z:.5,y:yT+.28,rx:1.2,ry:-.2,s:.95});
  [[.15,.65],[-.12,.62],[.68,.3]].forEach(([x,z])=>it.push({m:'ball',x,z,y:yT+.05}));
  /* pied du gâteau : médaillon en chocolat, étoiles et billes */
  it.push({m:'medal',x:.15,z:1.12,y:.04,rx:-1.25,ry:.25,s:1,base:1});
  [[-.85,.85],[-.95,.62],[.55,1.05]].forEach(([x,z],k)=>it.push({m:'star',c:k%2,x,z,y:.04,s:.9,ry:k,base:1}));
  [[-.72,1.0],[.9,.8],[-1.05,.4]].forEach(([x,z])=>it.push({m:'ball',x,z,y:.11,base:1}));
}
function k3Init(){
  const cv=document.createElement('canvas');cv.className='k3-cv';cv.setAttribute('aria-label','Gâteau sur-mesure en 3D, faites-le tourner du doigt');
  const gl=cv.getContext('webgl',{antialias:true,alpha:true,premultipliedAlpha:true});
  if(!gl)throw new Error('WebGL indisponible');gl.getExtension('OES_element_index_uint');
  K3.cv=cv;K3.gl=gl;
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,H3_VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,k3FS()));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);K3.u={};['uM','uVP','uNM','uC','uEye','uK','uA','uSeed'].forEach(n=>K3.u[n]=gl.getUniformLocation(pr,n));
  K3.aP=gl.getAttribLocation(pr,'aP');K3.aN=gl.getAttribLocation(pr,'aN');gl.enableVertexAttribArray(K3.aP);gl.enableVertexAttribArray(K3.aN);

  k3Build();K3.t0=performance.now();
  /* glisser pour tourner ; un glissement n'ouvre pas le configurateur */
  let drag=null;
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,m:0};K3.yawV=0;K3.touch=performance.now();});
  window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.x=e.clientX;drag.m+=Math.abs(dx);K3.yaw+=dx*.01;K3.yawV=dx*.01;});
  window.addEventListener('pointerup',()=>{if(drag)K3.moved=drag.m>8;drag=null;});
  cv.addEventListener('click',e=>{if(K3.moved){e.stopPropagation();e.preventDefault();K3.moved=false;}},true);
  window.addEventListener('resize',()=>{if(K3.host)k3Resize();});
  document.addEventListener('visibilitychange',k3Loop);
}
function k3Resize(){const h=K3.host;if(!h)return;const w=h.clientWidth,ht=h.clientHeight;if(!w||!ht)return;let d=Math.min(devicePixelRatio||1,1.75);if(w*ht*d*d>1.6e6)d=Math.sqrt(1.6e6/(w*ht));
  K3.cv.width=Math.round(w*d);K3.cv.height=Math.round(ht*d);K3.w=w;K3.h=ht;}
function k3Loop(){const run=K3.host&&K3.vis&&!document.hidden;if(run&&!K3.raf)K3.raf=requestAnimationFrame(k3Frame);if(!run&&K3.raf){cancelAnimationFrame(K3.raf);K3.raf=0;}}
function cake3dMount(){
  const host=document.querySelector('[data-cake3d]');
  if(!host){if(K3.host){K3.host=null;K3.vis=false;if(K3.io){K3.io.disconnect();K3.io=null;}k3Loop();}return;}
  if(!K3.tried){K3.tried=true;try{k3Init();}catch(e){console.warn('Gâteau 3D désactivé :',e);K3.fail=true;}}
  if(K3.fail){host.classList.add('k3-off');return;}
  host.prepend(K3.cv);K3.host=host;K3.rm=H3_RM();
  if(K3.io)K3.io.disconnect();K3.io=new IntersectionObserver(es=>{K3.vis=es[es.length-1].isIntersecting;k3Loop();});K3.io.observe(host);
  k3Resize();K3.last=0;k3Frame(true);

function k3Frame(force){
  K3.raf=0;if(!K3.host)return;const now=performance.now();
  /* 30 images par seconde suffisent sur la borne : moins de chauffe, plus de batterie */
  if(force!==true&&now-K3.last<31){if(K3.vis&&!document.hidden)K3.raf=requestAnimationFrame(k3Frame);return;}
  K3.last=now;
  const gl=K3.gl,S=K3.scene,u=K3.u,t=(now-K3.t0)/1000,rm=K3.rm,W=K3.w,Hh=K3.h;if(!W)return;

  const draw=(m,M,a)=>{gl.uniformMatrix4fv(u.uM,false,M);gl.uniformMatrix3fv(u.uNM,false,M4.n3(M));gl.uniform3fv(u.uC,m.c);gl.uniform1f(u.uK,m.k);gl.uniform1f(u.uA,a==null?1:a);gl.uniform1f(u.uSeed,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,m.pb);gl.vertexAttribPointer(K3.aP,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,m.nb);gl.vertexAttribPointer(K3.aN,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,m.ib);gl.drawElements(gl.TRIANGLES,m.cnt,m.it,0);};
  draw(S.board,G);draw(S.body,G);draw(S.drip,G,Math.min(1,intro(.3)*1.2));
  S.items.forEach((o,i)=>{const a=Math.min(1,Math.max(0,intro(.45+i*.035)));if(a<=0)return;const sc=(o.s||1)*a;
    const M=M4.ch(G,M4.tr(o.x,o.y+(o.base?0:(1-a)*.5),o.z),M4.ry(o.ry||0),M4.rx(o.rx||0),M4.sc(sc));
    if(o.m==='star')draw(S.star[o.c],M);
    else if(o.m==='heart'||o.m==='round'){const m=S[o.m],g=.06;draw(m.top,M4.mul(M,M4.tr(0,g,0)));draw(m.ft,M4.mul(M,M4.tr(0,g,0)));draw(m.bot,M4.mul(M,M4.tr(0,-g,0)));draw(m.ftb,M4.mul(M,M4.tr(0,-g,0)));draw(m.fill,M);}
    else draw(S[o.m],M);});
  gl.depthMask(false);draw(S.shadow,M4.ch(M4.tr(0,-.001,0),M4.sc(2.2)),.8);gl.depthMask(true);
  if(K3.vis&&!document.hidden)K3.raf=requestAnimationFrame(k3Frame);
}

function hubFx(){
  cake3dMount();
  const host=document.querySelector('[data-hero3d]');
  if(host)hero3dMount(host);else hero3dPause();
  const els=document.querySelectorAll('[data-reveal]');if(!els.length)return;
  if(H3_RM()||!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'));return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.15});
  els.forEach(e=>io.observe(e));
}

const H3={vis:false,p:0,pT:0,yaw:0,yawV:0,mx:0,my:0,mxT:0,myT:0,raf:0};
const H3_RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const M4={

  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},

/* géométries procédurales */
function g3Normals(p,ix){const n=new Float32Array(p.length);
  for(let i=0;i<ix.length;i+=3){const a=ix[i]*3,b=ix[i+1]*3,c=ix[i+2]*3;
    const ux=p[b]-p[a],uy=p[b+1]-p[a+1],uz=p[b+2]-p[a+2],vx=p[c]-p[a],vy=p[c+1]-p[a+1],vz=p[c+2]-p[a+2];

function g3Grid(rows,cols,fn,wrap){const p=[],ix=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)p.push(...fn(j,i));
  const C=wrap?cols:cols-1;
  for(let j=0;j<rows-1;j++)for(let i=0;i<C;i++){const a=j*cols+i,b=j*cols+(i+1)%cols,c=a+cols,d=b+cols;ix.push(a,c,b,b,c,d);}

/* shaders */
const H3_VS=`attribute vec3 aP;attribute vec3 aN;uniform mat4 uM,uVP;uniform mat3 uNM;varying vec3 vW,vN,vO;

const H3_FS=`precision highp float;varying vec3 vW,vN,vO;uniform vec3 uC,uEye;uniform float uK,uA,uSeed;
float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}

 if(uK<1.5){float p=fbm(vO*20.+uSeed);col*=.74+.45*p;col*=1.-.4*smoothstep(.66,.82,n3(vO*60.+uSeed));rough=.95;spec=.02;sss=.35;}

 else if(uK<3.5){col*=.96+.06*n3(vO*5.);rough=.08;spec=1.;}

 else if(uK<6.5){rough=.15;spec=.75;}
 else if(uK<7.5){col*=.92+.12*fbm(vO*26.);rough=.65;spec=.12;sss=.3;}
 else{col*=.9+.15*n3(vO*30.);rough=.35;spec=.35;sss=.5;}

 float dl=dot(N,L1),d1=mix(max(dl,0.),max((dl+.55)/1.55,0.),sss),d2=max(dot(N,L2),0.)*.4;

const H3_LIN=hex=>{const v=parseInt(hex.slice(1),16);return[(v>>16&255)/255,(v>>8&255)/255,(v&255)/255].map(x=>Math.pow(x,2.2));};
function h3Mesh(g,k,col,seed){const gl=H3.gl;const mk=(d,t)=>{const b=gl.createBuffer();gl.bindBuffer(t,b);gl.bufferData(t,d,gl.STATIC_DRAW);return b;};

function h3Build(){
  const S=H3.scene={tiers:[],float:[],top:[]};
  /* présentoir en céramique */
  S.stand=h3Mesh(g3Lathe([[0,0],[.72,0],[.74,.04],[.6,.09],[.26,.18],[.15,.3],[.13,.42],[.2,.48],[2.05,.5],[2.12,.54],[2.06,.6],[0,.6]],96),6,'#F2EEE7');
  S.shadow=h3Mesh(g3Lathe([[0,0],[1,0]],48),9,'#000000');
  /* trois étages « semi-nus » : génoise / crème alternées */
  const SP='#C7883F',CR='#FFF6EA';
  [[1.62,.98],[1.12,.86],[.66,.72]].forEach(([R,Ht],t)=>{

  S.drip=h3Mesh(g3Grid(rows+4,160,(j,i)=>{const a=i/160*Math.PI*2;let r,y;
    if(j<4){const u=j/3;r=(R+.025)*Math.sin(u*Math.PI/2)**.6;y=T.H+.045-.02*u*u;if(j===0)r=0;}

  const shell=g3Lathe([[0,0],[.44,0],[.5,.04],[.5,.1],[.42,.2],[.24,.26],[0,.275]],56);
  const foot=g3Lathe([[.42,-.02],[.51,0],[.53,.035],[.5,.06],[.43,.06]],56,(r,y,a)=>[r*(1+.03*Math.sin(a*23)*Math.sin(a*7)),y]);

  S.mint=h3Mesh(g3Lathe([[0,0],[.12,.01],[.2,.04],[.12,.075],[0,.08]],24,(r,y,a)=>[r*(.25+.75*Math.abs(Math.cos(a/2))),y]),8,'#4C9A47');
  /* croissant */
  S.crois=h3Mesh(g3Tube(t=>{const f=(t-.5)*2.5;return[Math.sin(f)*.62,0,Math.cos(f)*.62-.62];},(t,a)=>{const b=.3*Math.pow(Math.sin(Math.PI*t),.6)*(1+.24*Math.pow(Math.abs(Math.sin(t*Math.PI*6.5)),.7));return b*(Math.sin(a)<0?.72:1);},90,28),4,'#B26A26');

function h3Init(){

  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};

  let drag=null;
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,t:performance.now()};H3.yawV=0;});
  window.addEventListener('pointermove',e=>{
    if(drag){const dx=e.clientX-drag.x;drag.x=e.clientX;H3.yaw+=dx*.008;H3.yawV=dx*.008;}
    if(H3.host){H3.mxT=(e.clientX/innerWidth-.5)*2;H3.myT=(e.clientY/innerHeight-.5)*2;}});
  window.addEventListener('pointerup',()=>{drag=null;});
  window.addEventListener('scroll',h3Scroll,{passive:true});
  window.addEventListener('resize',()=>{if(H3.host)h3Resize();});
  document.addEventListener('visibilitychange',h3Loop);
}
function h3Scroll(){
  const sec=document.querySelector('.h3');if(sec){const r=sec.getBoundingClientRect(),run=Math.max(1,r.height-innerHeight);H3.pT=Math.min(1,Math.max(0,-r.top/run));}
  const sh=document.querySelector('.lp-show .tilt');if(sh){const r=sh.getBoundingClientRect(),k=Math.max(-1,Math.min(1,(r.top+r.height/2-innerHeight/2)/innerHeight));sh.style.setProperty('--sx',(k*14).toFixed(2)+'deg');}

}
function h3Resize(){const h=H3.host;if(!h)return;const w=h.clientWidth,ht=h.clientHeight;let d=Math.min(devicePixelRatio||1,2);if(w*ht*d*d>3.2e6)d=Math.sqrt(3.2e6/(w*ht));
  H3.cv.width=Math.round(w*d);H3.cv.height=Math.round(ht*d);H3.w=w;H3.h=ht;if(!H3.raf)h3Frame();}
function h3Loop(){const run=H3.host&&H3.vis&&!document.hidden;if(run&&!H3.raf)H3.raf=requestAnimationFrame(h3Frame);if(!run&&H3.raf){cancelAnimationFrame(H3.raf);H3.raf=0;}}
function hero3dMount(host){
  if(!H3.tried){H3.tried=true;try{h3Init();}catch(e){console.warn('Accueil 3D désactivé :',e);H3.fail=true;}}
  if(H3.fail){host.classList.add('h3-off');return;}
  host.prepend(H3.cv);H3.host=host;H3.labels=[...host.querySelectorAll('[data-lbl]')];H3.story=document.querySelector('.h3-story');H3.copy=document.querySelector('.h3-copy');H3.hint=document.querySelector('.h3-hint');H3.rm=H3_RM();
  if(H3.io)H3.io.disconnect();H3.io=new IntersectionObserver(es=>{H3.vis=es[es.length-1].isIntersecting;h3Loop();});H3.io.observe(host);

function hero3dPause(){H3.host=null;H3.vis=false;if(H3.io){H3.io.disconnect();H3.io=null;}h3Loop();}

const h3Ease=x=>{x=Math.min(1,Math.max(0,x));const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function h3Frame(){

  const now=(performance.now()-H3.t0)/1000,rm=H3.rm,t=rm?20:now;
  H3.p+=(H3.pT-H3.p)*.08;H3.mx+=(H3.mxT-H3.mx)*.05;H3.my+=(H3.myT-H3.my)*.05;
  if(!rm){H3.yaw+=.0035+H3.yawV;H3.yawV*=.94;}

  const dist=wide?12.6+ep*4.4:23-ep*3.5,ty=2.05+ep*1.7,pitch=.2+H3.my*.06-ep*.06,yaw=H3.mx*.12;
  const eye=[Math.sin(yaw)*Math.cos(pitch)*dist,ty+Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist];

  const draw=(m,M,a)=>{gl.uniformMatrix4fv(u.uM,false,M);gl.uniformMatrix3fv(u.uNM,false,M4.n3(M));gl.uniform3fv(u.uC,m.c);gl.uniform1f(u.uK,m.k);gl.uniform1f(u.uA,a==null?1:a);gl.uniform1f(u.uSeed,m.seed);
    gl.bindBuffer(gl.ARRAY_BUFFER,m.pb);gl.vertexAttribPointer(H3.aP,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,m.nb);gl.vertexAttribPointer(H3.aN,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,m.ib);gl.drawElements(gl.TRIANGLES,m.cnt,m.it,0);};
  const intro=i=>rm?1:h3Ease((now-.25-i*.28)/1.1);

    T.y=yT;T.top=yT+T.H+3*sep;anchors.push([(ti===1?-1:1)*T.R*.95,yT+T.H*.55+sep,0]);base+=T.H;});
  const top=S.tiers[2],ty3=top.top-(3*ep*.16);
  const di=Math.min(1,intro(2.6)*1.3);
  draw(S.drip,M4.mul(G,M4.tr(0,top.y+3*ep*.16,0)),di);
  /* garniture */
  const yTop=top.y+top.H+.045+3*ep*.16+ep*.35;
  S.top.forEach((o,i)=>{const a=Math.min(1,Math.max(0,intro(3+i*.25)));if(a<=0)return;const sc=(o.s||1)*a;
    const M=M4.ch(G,M4.tr(o.x,yTop+(o.y||0)*sc,o.z),M4.ry(o.ry||0),M4.rx(o.rx||0),M4.sc(sc));h3Obj(draw,o,M,i);});
  anchors.push([.15,yTop+.35,0]);
  /* objets en orbite */
  S.float.forEach((o,i)=>{const a=Math.min(1,Math.max(0,intro(1.5+i*.35)));if(a<=0)return;
    const ang=o.a+t*.12,r=o.r+ep*1.1,y=o.y+Math.sin(t*.9+i*1.7)*.18+ep*1.2;
    const M=M4.ch(M4.ry(H3.yaw*.35),M4.tr(Math.cos(ang)*r,y,Math.sin(ang)*r),M4.ry(t*.6+i),M4.rx(Math.sin(t*.7+i)*.5+.5),M4.rz(.4),M4.sc(o.s*a));h3Obj(draw,o,M,i);});
  /* ombre portée douce */
  gl.depthMask(false);draw(S.shadow,M4.ch(M4.tr(0,.002,0),M4.sc(2.9)),Math.min(1,now));gl.depthMask(true);
  /* étiquettes HTML accrochées aux étages */
  const la=Math.min(1,Math.max(0,(ep-.35)/.35));
  (H3.labels||[]).forEach((el,i)=>{const w=anchors[2-i];if(!w)return;const P=M4.xf(VP,w);
    let lx=(P[0]*.5+.5)*W;const ew=el.offsetWidth+10;lx=i===1?Math.max(lx,ew):Math.min(lx,W-ew);
    el.style.transform=`translate(${lx.toFixed(1)}px,${((.5-P[1]*.5)*Hh).toFixed(1)}px) translate(${i===1?'-100%':'0'},-50%)`;el.style.opacity=la.toFixed(3);});
  if(H3.copy){const o=1-Math.min(1,Math.max(0,(ep-.08)/.3));H3.copy.style.opacity=o.toFixed(3);H3.copy.style.transform=`translateY(${(-(1-o)*40).toFixed(1)}px)`;H3.copy.style.visibility=o<.02?'hidden':'';}
  if(H3.story)H3.story.style.opacity=Math.min(1,Math.max(0,(ep-.55)/.3)).toFixed(3);
  if(H3.hint)H3.hint.style.opacity=Math.max(0,1-p*8).toFixed(3);
  if(H3.host&&H3.vis&&!document.hidden)H3.raf=requestAnimationFrame(h3Frame);
}
function h3Obj(draw,o,M,i){const S=H3.scene;

const catLabel=k=>(CAKE_CATS.find(c=>c[0]===k)||[])[1]||k||'';

function famPrice(f,v,n){if(f.mode==='formats'){const x=fmtOf(f,n);return x?x.price:0;}return n*unitPrice(f,v);}

function famDecos(t,f){const all=(t.cake&&t.cake.decos)||[];if(!f||f.decos==null)return all;return all.filter(o=>f.decos.includes(String(o.id)));}
function allowedUnits(f){if(f.mode==='formats')return f.formats.map(x=>x.n);if(f.mode==='fixed')return f.sizes.slice();const a=[];for(let n=f.min;n<=f.max&&a.length<500;n+=Math.max(1,f.step))a.push(n);return a;}

function unitsFor(t,f,v){const p=f&&f.mode==='free'&&linkedProd(t,v);if(!p)return allowedUnits(f);const a=[],st=2;for(let n=p.cakeMin;n<=p.cakeMax&&a.length<500;n+=st)a.push(n);return a.length?a:allowedUnits(f);}

function firstSlot(min){const x=new Date(min);const m=x.getHours()*60+x.getMinutes();let r=Math.max(5*60,Math.ceil(m/30)*30);if(r>23*60){x.setDate(x.getDate()+1);r=5*60;}return{dk:dayKey(x),slot:pad(Math.floor(r/60))+':'+(r%60?'30':'00')};}

/* musique d'ambiance générée par l'appli (libre de droits) */
function vMusic(actx,dest,pal,total){
  const bpm=pal.tempo||88,beat=60/bpm,t0=actx.currentTime+.1,base=220*Math.pow(2,(pal.key||0)/12);
  const prog=[[0,4,7],[7,11,14],[9,12,16],[5,9,12]];const master=actx.createGain();master.gain.value=.0;master.connect(dest);
  master.gain.setValueAtTime(0,t0);master.gain.linearRampToValueAtTime(.55,t0+1.5);master.gain.setValueAtTime(.55,t0+Math.max(1.6,total-1.8));master.gain.linearRampToValueAtTime(0,t0+total);

  const bar=beat*4;for(let b=0;b*bar<total;b++){const ch=prog[b%4],at=t0+b*bar;
    ch.forEach(s=>note(base*Math.pow(2,s/12)/2,at,bar*1.05,'sine',.07));note(base*Math.pow(2,ch[0]/12)/4,at,bar*.9,'triangle',.12);
    for(let s=0;s<8;s++){const deg=ch[[0,1,2,1,0,2,1,2][s]];note(base*Math.pow(2,(deg+12)/12)/2,at+s*beat/2,beat*.9,'triangle',.05);}}
}

  const done=new Promise(ok=>{rec.onstop=ok;});

  await new Promise(ok=>{let last=-1;const step=()=>{const time=(performance.now()-start)/1000;

${prods.map((p,i)=>`${i} : ${p.name}, ${p.desc||'sans description'}, ${(p.price/100).toFixed(2).replace('.',',')} €`).join('\n')}

Réponds uniquement avec un objet JSON de cette forme, sans texte autour :
{"title":"titre court","hook":"phrase d'accroche","style":{"theme":"${style.theme}","transition":"fondu","badge":""},"scenes":[{"seconds":3,"productIndex":0,"visual":"description du plan","caption":"texte à l'écran","voiceover":"texte de la voix off"}],"cta":"appel à l'action","hashtags":["#exemple"]}
productIndex vaut null quand la scène ne montre pas un produit précis.`;
}
function normalizeScript(r,n,fallbackStyle){

  const scenes=r.scenes.slice(0,10).filter(s=>s&&typeof s==='object').map(s=>({seconds:Math.round(Math.min(10,Math.max(1.5,Number(s.seconds)||3))*10)/10,productIndex:Number.isInteger(s.productIndex)&&s.productIndex>=0&&s.productIndex<n?s.productIndex:null,visual:str(s.visual,''),caption:str(s.caption,''),voiceover:str(s.voiceover,'')})).filter(s=>s.caption||s.voiceover);

  const style={theme:VTHEMES[rs.theme]?rs.theme:fb.theme,transition:['fondu','glisse','zoom'].includes(rs.transition)?rs.transition:fb.transition,badge:typeof rs.badge==='string'?rs.badge.trim().slice(0,18):fb.badge};

}
const VHOOKS={chaleureux:'Tout juste sorti du four',automne:'Les saveurs d’automne sont là',noel:'La magie des fêtes',printemps:'Le printemps en vitrine',ete:'Un goût d’été',chic:'L’art de la pâtisserie',fun:'Ça va être bon !',minimal:'Fait maison, chaque jour',boutique:'Tout juste sorti du four'};

async function aiScript(t,prods,brief,style){
  const prompt=buildPrompt(t,prods,brief,style);
  const parse=d=>{if(!d)return null;if(typeof d==='string')d=JSON.parse(d);return normalizeScript(d.script||d,prods.length,style);};
  const delai=ms=>new Promise(ok=>setTimeout(()=>ok(null),ms));
  /* 1. Claude, via la fonction Netlify /api/video-script (clé ANTHROPIC_API_KEY côté serveur) */
  try{
    let tok=null;try{const {data}=await sb.auth.getSession();tok=data&&data.session&&data.session.access_token;}catch(e){}
    const r=await Promise.race([fetch('/api/video-script',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},tok?{Authorization:'Bearer '+tok}:{}),body:JSON.stringify({prompt})}),delai(45000)]);
    if(r&&r.ok){const s=parse(await r.json());if(s)return s;}
  }catch(e){}
  /* 2. ancien service Supabase, s'il existe */
  try{
    const res=await Promise.race([sb.functions.invoke('video-script',{body:{prompt}}),delai(30000)]);
    if(!res||res.error||!res.data)return null;
    return parse(res.data);
  }catch(e){return null;}
}
