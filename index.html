  async saveFam(){
    const t=curT(),d=B.editFam;if(!d)return;
    const name=String(d.name||'').trim();if(!name)return toast('Donnez un nom à la famille.');
    let price=Math.round(parseFloat(String(d.priceStr).replace(',','.'))*100);
    let formats=[];
    if(d.mode==='formats'){
      for(const x of d.formats){const lb=String(x.label||'').trim(),n=parseInt(x.nStr,10),pc=Math.round(parseFloat(String(x.priceStr||'').replace(',','.'))*100);
        if(!lb&&!String(x.nStr||'').trim()&&!String(x.priceStr||'').trim())continue;
        if(!(n>=1&&n<=500))return toast('Indiquez un nombre de '+unitWord(d.unit,2)+' entre 1 et 500 pour chaque format.');
        if(!(pc>=0))return toast('Indiquez un prix valide pour le format « '+(lb||n)+' », par exemple 25,00.');
        if(formats.some(z=>z.n===n))return toast('Deux formats ne peuvent pas avoir le même nombre de '+unitWord(d.unit,2)+'.');
        formats.push({n,label:lb||n+' '+unitWord(d.unit,n),price:pc});}
      if(!formats.length)return toast('Ajoutez au moins un format avec son prix.');
      formats.sort((a,b)=>a.n-b.n);if(!(price>=0))price=0;
    }else if(!(price>=0))return toast('Indiquez un prix valide, par exemple 3,70.');
    const mn=parseInt(d.minStr,10),mx=parseInt(d.maxStr,10),st=parseInt(d.stepStr,10)||1;
    const sizes=[...new Set(String(d.sizesStr||'').split(/[^0-9]+/).filter(Boolean).map(Number).filter(n=>n>=1&&n<=500))].sort((a,b)=>a-b);
    if(d.mode==='fixed'&&!sizes.length)return toast('Indiquez au moins une taille, par exemple 4, 6, 8.');
    if(d.mode==='free'&&!(mn>=1&&mx>=mn&&mx<=500))return toast('Vérifiez le minimum et le maximum (entre 1 et 500).');
    const row={tenant_id:t.id,name,description:String(d.desc||'').trim()||null,unit_label:d.unit,price_cents:price,parts_mode:d.mode,min_units:mn>=1?mn:1,max_units:mx>=(mn||1)?Math.min(mx,500):Math.max(mn||1,30),step_units:Math.max(1,st),sizes,formats,tier_max:Math.max(0,parseInt(d.tiersStr,10)||0),ask_number:!!d.askNumber,active:!!d.active};
    {const all=(t.cake.decos||[]).map(o=>String(o.id)),sel=d.decoSel==null?null:d.decoSel.filter(id=>all.includes(id));if(sel==null&&(t.fam||[]).every(f=>f.decos==null))delete row.deco_ids;else row.deco_ids=sel==null||sel.length===all.length?null:sel;}
    {const seen=new Set(),flv=(d.flavors||[]).map(x=>({name:String(x.name||'').trim().slice(0,30),active:x.active!==false})).filter(x=>x.name&&!seen.has(x.name.toLowerCase())&&seen.add(x.name.toLowerCase()));if(!flv.length&&(t.fam||[]).every(f=>!f.flavors.length))delete row.flavors;else row.flavors=flv;}
    try{
      if(d.id)await famWrite(row,d.id);
      else await famWrite(Object.assign(row,{position:(t.fam||[]).length+1}));
      await reloadCake();B.editFam=null;toast('Famille enregistrée.');render();
    }catch(e){toast(/tier_max|ask_number/.test((e&&e.message)||'')?V2_SQL_MSG:/flavors/.test((e&&e.message)||'')?'Mise à jour de la base nécessaire : exécutez une fois le script « parfums par famille » dans Supabase (SQL Editor), puis réessayez.':/deco_ids/.test((e&&e.message)||'')?'Mise à jour de la base nécessaire : exécutez une fois le script « options par famille » dans Supabase (SQL Editor), puis réessayez.':errMsg(e));}},

async function handleFile(el){
  const files=[...el.files],kind=el.dataset.file;el.value='';if(!files.length)return;
  try{
    if(kind==='cover'){toast('Envoi de la photo…');const blob=await resizeToBlob(files[0],1800,0.82);const url=await uploadMedia(blob,'cover');await patchBranding({cover_url:url});toast('Photo de couverture enregistrée.');render();}
    else if(kind==='prodImage'){const d=B.editProd;toast('Préparation de la photo…');const raw=await resizeToBlob(files[0],2000,0.92);const m=await finishMedia(raw,getBgMode(),0.9);if(B.editProd!==d)return;d.image=m;toast(m.ok?'Photo prête : vérifiez l’aperçu, puis enregistrez.':BG_WARN);render();}
    else if(kind==='prodVideo'){if(B.v360)return;const f=files[0];
      if(f.size>300*1024*1024)return toast('Vidéo trop lourde : filmez 5 à 15 secondes suffisent.');
      const d=B.editProd,mode=getBgMode();B.v360={n:48,done:0,label:'Sélection des images les plus nettes'};render();
      try{const raws=await videoToFrames(f,48,1440,v360Step);raws.forEach(r=>URL.revokeObjectURL(r.url));
        let out=raws.map(r=>({blob:r.blob,url:URL.createObjectURL(r.blob),raw:r.blob,ok:true})),bad=0;
        if(mode!=='off'){B.v360={n:raws.length,done:0,label:'Mise sur fond noir'};render();out=[];
          for(let i=0;i<raws.length;i++){const m=await finishMedia(raws[i].blob,mode,.9);if(!m.ok)bad++;out.push(m);v360Step(i+1);}}
        if(B.editProd===d){d.frames=out;toast(bad?BG_WARN:'Vue 360° prête : vérifiez l’aperçu, puis enregistrez.');}}
      finally{B.v360=null;render();}}
    else if(kind==='prodFrames'){if(files.length<8)return toast('Importez au moins 8 photos pour une vue 360°, idéalement 24 à 36.');
      const list=files.slice(0,72).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));toast(`Préparation de ${list.length} photos…`);
      const d=B.editProd,mode=getBgMode(),out=[];let bad=0;for(const f of list){const raw=await resizeToBlob(f,1440,0.92);const m=await finishMedia(raw,mode,.9);if(!m.ok)bad++;out.push(m);}if(B.editProd!==d)return;d.frames=out;if(bad)toast(BG_WARN);render();}
    else if(kind==='varImage'){toast('Envoi de la photo…');const blob=await resizeToBlob(files[0],1200,0.82);const url=await uploadMedia(blob,'varieties');await q(sb.from('cake_varieties').update({image_url:url}).eq('id',el.dataset.id));await reloadCake();toast('Photo enregistrée.');render();}
    else if(kind==='modelImage'){const d=B.editModel;toast('Préparation de la photo…');const raw=await resizeToBlob(files[0],2000,0.92);const m=await finishMedia(raw,getBgMode(),0.9);if(B.editModel!==d)return;d.image=m;toast(m.skip&&!m.ok?BG_WARN:'Photo prête : vérifiez l’aperçu, puis enregistrez.');render();}
    else if(kind==='famImage'){toast('Envoi de la photo…');const raw=await resizeToBlob(files[0],2000,0.92);const m=await finishMedia(raw,getBgMode(),0.9);const url=await uploadMedia(m.blob,'families');await q(sb.from('cake_families').update({image_url:url}).eq('id',el.dataset.id));await reloadCake();toast('Photo enregistrée.');render();}
    else if(kind==='posterImage'){toast('Envoi de la photo…');const blob=await resizeToBlob(files[0],1800,0.85);const url=await uploadMedia(blob,'poster');await savePoster({image:url});toast('Photo de l’affiche enregistrée.');render();}
    else if(kind==='cakeHero'){toast('Envoi de la photo…');const blob=await resizeToBlob(files[0],1600,0.82);const url=await uploadMedia(blob,'cake');await patchBranding({cake_hero_url:url});toast('Photo du bandeau enregistrée.');render();}
    else if(kind==='cakePhotos'){const room=3-K.cake.photos.length;for(const f of files.slice(0,room)){const blob=await resizeToBlob(f,1200,0.8);K.cake.photos.push({blob,url:URL.createObjectURL(blob)});}K.keepScroll=true;render();}
  }catch(err){toast(err&&err.message&&(errMsg(err)===V2_SQL_MSG||!/lecture|image|conversion/.test(err.message))?errMsg(err):'Cette image n’a pas pu être lue. Essayez une photo JPEG ou PNG.');}
}

/* ---------- écouteurs ---------- */
document.addEventListener('click',e=>{
  const z=e.target.closest('[data-zoom]');if(z){e.preventDefault();e.stopPropagation();openZoom(z.currentSrc||z.src,z.alt);return;}
  const z3=e.target.closest('[data-zoom360]');if(z3){e.preventDefault();e.stopPropagation();const t=curT();const p=t&&t.products.find(x=>x.id===z3.dataset.zoom360);if(p)openZoom360(p);return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.dataset.confirm&&!el.dataset.armed){e.preventDefault();el.dataset.armed='1';el.dataset.orig=el.innerHTML;el.textContent=el.dataset.confirm;setTimeout(()=>{if(el.isConnected&&el.dataset.armed){delete el.dataset.armed;el.innerHTML=el.dataset.orig;}},3500);return;}
  fn(el,e);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();return;}
  if(!document.querySelector('.pin'))return;
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(/^\d$/.test(e.key)){e.preventDefault();ACT.pinKey({dataset:{k:e.key}});}
  else if(e.key==='Backspace'){e.preventDefault();ACT.pinDel();}
  else if(e.key==='Enter'&&K.pin.length>=4){e.preventDefault();ACT.pinOk();}
  else if(e.key==='Escape'&&K.ov==='pin'){K.ov=null;render();}
});
document.addEventListener('submit',async e=>{
  const f=e.target;const fn=FORMS[f.dataset.form];if(!fn)return;e.preventDefault();
  const btns=[...f.querySelectorAll('[type=submit]')].concat(f.id?[...document.querySelectorAll(`[form="${f.id}"]`)]:[]);
  if(btns.some(b=>b.disabled))return;
  const saved=btns.map(b=>b.innerHTML);btns.forEach(b=>{b.disabled=true;b.textContent='Patientez…';});
  const old=f.querySelector('.ferr');if(old)old.remove();CURFORM=f;
  try{await fn(f,new FormData(f));}catch(err){toast(errMsg(err));}
  finally{CURFORM=null;btns.forEach((b,i)=>{if(b.isConnected){b.disabled=false;b.innerHTML=saved[i];}});}
});
function bindSet(path,val){const [scope,p]=path.split(':');const keys=p.split('.');let o=scope==='K'?K:B;for(let i=0;i<keys.length-1;i++){o=o[keys[i]];if(!o)return;}o[keys[keys.length-1]]=val;}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.bind)bindSet(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);
  if(el.dataset.bind&&el.dataset.bind.startsWith('B:editProd.cake')&&B.editProd){const ce=document.getElementById('cakeEx');if(ce)ce.textContent=cakeExample(B.editProd);}
  if(el.dataset.live){const prev=document.getElementById('brandPrev'),t=curT();if(prev&&t){const b=Object.assign({},t.branding,{[el.dataset.live]:el.value});Object.entries(kVarsObj(b)).forEach(([k,v])=>prev.style.setProperty(k,v));const hx=el.parentElement.querySelector('.hex');if(hx)hx.textContent=el.value;const h=document.getElementById('contrastHint');if(h)h.textContent=contrastHint(b);}}
  if(el.hasAttribute('data-autoslug')){const s=el.form&&el.form.querySelector('[data-slug]');if(s&&!s.dataset.touched)s.value=slugify(el.value);}
  if(el.hasAttribute('data-slug'))el.dataset.touched='1';
  if(el.hasAttribute('data-filter')){const qv=el.value.trim().toLowerCase();document.querySelectorAll('tr[data-name]').forEach(tr=>{tr.style.display=!qv||tr.dataset.name.includes(qv)?'':'none';});document.querySelectorAll('[data-sec]').forEach(sc=>{sc.style.display=!qv||[...sc.querySelectorAll('tr[data-name]')].some(tr=>tr.style.display!=='none')?'':'none';});}
});
const COLMAP={primary:'color_primary',bg:'color_bg',accent:'color_accent'};
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.file){handleFile(el);return;}
  if(el.dataset.bind&&el.type==='checkbox')bindSet(el.dataset.bind,el.checked);
  if(el.dataset.alg&&B.editProd){const a=el.dataset.alg;B.editProd.allergens=B.editProd.allergens.filter(z=>z!==a);if(el.checked)B.editProd.allergens.push(a);return;}
  if(el.dataset.famdeco&&B.editFam){const t0=curT(),all=(t0.cake.decos||[]).map(o=>String(o.id));let sel=B.editFam.decoSel==null?all.slice():B.editFam.decoSel.filter(id=>all.includes(id));const id=el.dataset.famdeco;sel=sel.filter(z=>z!==id);if(el.checked)sel.push(id);B.editFam.decoSel=sel;return;}
  const kind=el.dataset.change;if(!kind)return;
  if(kind==='bgMode'){setBgMode(el.value);reprocessProd();return;}
  if(kind==='rerender'){render();return;}
  if(kind==='tStatus'||kind==='tPlan'){const col=kind==='tStatus'?'status':'plan';
    sb.from('tenants').update({[col]:el.value}).eq('id',el.dataset.id).then(({error})=>{if(error)toast(errMsg(error));else{const x=ADM&&ADM.tenants.find(z=>z.id===el.dataset.id);if(x)x[col]=el.value;toast('Abonnement mis à jour.');}render();});return;}
  const t=curT();if(!t)return;
  if(kind==='prodActive'){const p=t.products.find(z=>z.id===el.dataset.id);if(!p)return;p.active=el.checked;
    sb.from('products').update({active:el.checked}).eq('id',p.id).then(({error})=>{if(error){p.active=!el.checked;toast(errMsg(error));render();}else{toast(p.active?'Produit remis en vente.':'Produit retiré de la borne.');if(p.cakeOn&&p.cakeVar)sb.from('cake_varieties').update({active:p.active}).eq('id',p.cakeVar).then(()=>reloadCake().catch(()=>{}));}});}
  else if(kind==='cakeField'){const f=el.dataset.f;let upd={};
    if(f==='price'){const v=Math.round(parseFloat(el.value.replace(',','.'))*100);if(!(v>=0)){toast('Prix invalide : utilisez un nombre, par exemple 4,50.');render();return;}upd.price_cents=v;}
    else if(f==='servings')upd.servings=Math.max(1,parseInt(el.value,10)||1);
    else{const v=el.value.trim();if(!v){render();return;}upd.label=v;}
    safe(async()=>{await q(sb.from('cake_options').update(upd).eq('id',el.dataset.id));await reloadCake();},'Enregistré.');}
  else if(kind==='tartName'){const v=el.value.trim();if(!v){render();return;}safe(async()=>{await q(sb.from('cake_families').update({name:v}).eq('id',el.dataset.id));await reloadCake();},'Enregistré.');}
  else if(kind==='tartPrice'){const f=(t.fam||[]).find(z=>z.id===el.dataset.id);if(!f)return;const n=Number(el.dataset.n),sv=el.value.trim();let fm=f.formats.filter(x=>x.n!==n);
    if(sv){const v=Math.round(parseFloat(sv.replace(',','.'))*100);if(!(v>0)){toast('Prix invalide : utilisez un nombre, par exemple 18,00.');render();return;}fm.push({n,label:n+' personnes',price:v});}
    fm.sort((a,b)=>a.n-b.n);safe(async()=>{await q(sb.from('cake_families').update({formats:fm}).eq('id',f.id));await reloadCake();},sv?'Prix enregistré.':'Taille retirée pour cette tarte.');}
  else if(kind==='famActive'){safe(async()=>{await q(sb.from('cake_families').update({active:el.checked}).eq('id',el.dataset.id));await reloadCake();},el.checked?'Visible sur la borne.':'Masquée sur la borne.');}
  else if(kind==='famMode'){if(B.editFam){B.editFam[el.dataset.bind.split('.').pop()]=el.value;render();}}
  else if(kind==='varField'){const f=el.dataset.f;let upd={};
    if(f==='price'){const s=el.value.trim();if(!s)upd.price_cents=null;else{const v=Math.round(parseFloat(s.replace(',','.'))*100);if(!(v>=0)){toast('Prix invalide : utilisez un nombre, par exemple 3,60.');render();return;}upd.price_cents=v;}}
    else{const v=el.value.trim();if(!v){render();return;}upd.name=v;}
    safe(async()=>{await q(sb.from('cake_varieties').update(upd).eq('id',el.dataset.id));await reloadCake();},'Enregistré.');}
  else if(kind==='varActive'){safe(async()=>{await q(sb.from('cake_varieties').update({active:el.checked}).eq('id',el.dataset.id));await reloadCake();},el.checked?'Variété visible sur la borne.':'Variété masquée.');}
  else if(kind==='shopName'){const v=el.value.trim();if(v.length<2)return render();safe(async()=>{await q(sb.from('tenants').update({name:v}).eq('id',t.id));t.name=v;},'Nom enregistré.');}
  else if(kind==='brandLegal'){const k=el.dataset.k;const v=k==='retention_months'?parseInt(el.value,10):(el.value.trim()||null);
    if(k==='legal_email'&&v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('Adresse e-mail invalide.');return;}
    safe(async()=>{await patchBranding({[k]:v});},'Enregistré.');}
  else if(kind==='poster'){const k=el.dataset.k;let v;
    if(k==='on')v=el.checked;
    else if(k==='price'){const sv=el.value.trim();if(!sv)v=null;else{v=Math.round(parseFloat(sv.replace(',','.'))*100);if(!(v>=0)){toast('Prix invalide : utilisez un nombre, par exemple 3,50.');render();return;}}}
    else if(k==='productId')v=el.value||null;
    else v=el.value.trim();
    if(k==='on'&&v&&!posterOf({products:t.products,branding:{poster:Object.assign({},t.branding.poster,{on:true})}})){toast('Choisissez d’abord un produit ou importez une photo avec un titre.');el.checked=false;return;}
    safe(async()=>{await savePoster({[k]:v});},k==='on'?(v?'Affiche activée sur la borne.':'Affiche désactivée.'):'Enregistré.');}
  else if(kind==='brandText'){safe(async()=>{await patchBranding({tagline:el.value.trim()||null});},'Enregistré.');}
  else if(kind==='brandColor'){safe(async()=>{await patchBranding({[COLMAP[el.dataset.k]]:el.value});});}
});

/* ---------- veille de la borne ---------- */
let lastAct=Date.now();
['pointerdown','keydown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true,capture:true}));
setInterval(()=>{
  const p=route(),idle=(Date.now()-lastAct)/1000;
  if(p[0]==='b'&&!p[2]&&D&&D.t){
    const reset=()=>{closeZoom();const tid=K.tid;K=freshK();K.tid=tid;render();};
    if(K.ov==='idle'){const left=Math.max(0,15-Math.floor((Date.now()-K.idleAt)/1000));const el=document.getElementById('idleCount');if(el)el.textContent=left;if(left<=0)reset();}
    else if(K.ov==='done'){if(idle>=15)reset();}
    else if(K.sending){}
    else if(K.screen==='poster'&&!K.ov&&idle>=30)reset();
    else if(K.screen==='menu'&&(K.cart.length||(K.ov&&K.ov!=='pin'&&K.ov!=='shoplogin'))&&idle>=75){closeZoom();K.prevOv=K.ov;K.ov='idle';K.idleAt=Date.now();render();}
    else if(K.screen==='menu'&&!K.cart.length&&!K.ov&&idle>=60)reset();
    else if((K.ov==='pin'||K.ov==='shoplogin')&&idle>=60){K.ov=null;render();}
  }else if(p[0]==='b'&&p[2]==='gestion'&&STAFF&&idle>=300){
    lockStaff();B=freshB();go('#/b/'+p[1]);toast('Session fermée après 5 minutes sans activité.');
  }
},1000);

/* ---------- démarrage ---------- */
(async()=>{
  if(!sb){render();return;}
  sb.auth.onAuthStateChange((event,session)=>{AUTH.session=session||null;if(!session)AUTH.profile=null;});
  if(!location.hash&&isStandalone()){try{const s=localStorage.getItem('prox_last_shop');if(s)history.replaceState(null,'','#/b/'+s);}catch(e){}}
  $('#app').innerHTML=loadingView();
  try{await refreshAuth();}catch(e){}
  render();
})();

</script>
